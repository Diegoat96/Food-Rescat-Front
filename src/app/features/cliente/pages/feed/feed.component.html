<div class="min-h-screen bg-surface-alt">
  <div class="mx-auto max-w-5xl space-y-6 p-6 lg:p-8">
    <app-impacto-cliente />

    <!-- Buscador -->
    <div class="flex items-center gap-2 rounded-2xl border border-border bg-surface px-4 py-3">
      <span class="flex items-center text-text-muted">
      <lucide-icon name="search" size="18" />
    </span>
      <input
        type="text"
        placeholder="Buscar alimentos o comercio…"
        (input)="onBusqueda($event)"
        class="w-full bg-transparent text-text placeholder-text-muted/60 focus:outline-none"
      />
    </div>

    <!-- Filtro por categoría -->
    <app-filtro-categorias
      [seleccion]="seleccionCategoria()"
      (seleccionCambio)="onSeleccionCategoria($event)"
    />

    <!-- Sucursales del feed -->
    @if (sucursales().length > 0) {
      <section class="space-y-3">
        <h3 class="text-sm font-bold uppercase tracking-wide text-text-muted">Sucursales</h3>
        <div class="flex gap-4 overflow-x-auto pb-2">
          @for (s of sucursales(); track s.id) {
            <app-sucursal-card [sucursal]="s" />
          }
        </div>
      </section>
    }

    <!-- Grid de paquetes -->
    @if (cargando() && paquetes().length === 0) {
      <app-loading-spinner texto="Cargando paquetes…" />
    } @else if (paquetesFiltrados().length === 0) {
      <app-empty-state
        icono="utensils"
        titulo="No hay paquetes disponibles"
        descripcion="Los comercios aún no han publicado alimentos. ¡Vuelve pronto!"
      />
    } @else {
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        @for (p of paquetesFiltrados(); track p.id) {
          <app-paquete-card [paquete]="p" (reservaExitosa)="onReservaExitosa($event)" />
        }
      </div>
    }
  </div>
</div>

@if (ticket()) {
  <app-ticket-rescate-modal [reserva]="ticket()!" (cerrar)="cerrarTicket()" />
}
