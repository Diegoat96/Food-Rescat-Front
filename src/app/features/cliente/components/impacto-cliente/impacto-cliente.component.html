<section class="rounded-2xl bg-primary-600 p-6 text-white lg:p-8">
  <div class="flex items-center gap-3">
    <span class="text-3xl">🍃</span>
    <div>
      <p class="text-lg font-extrabold leading-tight">Food Rescat</p>
      <p class="text-sm text-primary-100">Rescata alimentos, alimenta personas.</p>
    </div>
  </div>

  <p class="mt-4 max-w-xl text-sm text-primary-50">
    Cada paquete que reservas ayuda a reducir el desperdicio en tu comunidad. ¡Mira lo que juntos
    hemos logrado!
  </p>

  <div class="mt-6 grid grid-cols-3 gap-4">
    @for (d of datos(); track d.label) {
      <div class="rounded-xl bg-white/10 p-3 text-center">
        <p class="text-xl font-extrabold lg:text-2xl">{{ d.valor }}</p>
        <p class="mt-0.5 text-xs text-primary-100">{{ d.label }}</p>
      </div>
    }
  </div>
</section>
