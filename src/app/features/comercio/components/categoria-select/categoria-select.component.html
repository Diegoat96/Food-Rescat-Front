<div>
  <label class="mb-1 block text-sm font-medium text-text">Categoría</label>
  <select
    [value]="value()"
    (change)="onSelect($event)"
    class="w-full rounded-lg border border-border bg-surface px-4 py-3 text-text focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20 transition-colors"
  >
    <option value="" disabled>Selecciona una categoría…</option>
    @for (c of categorias(); track c.id) {
      <option [value]="c.id">{{ c.nombre }}</option>
    }
  </select>
</div>
