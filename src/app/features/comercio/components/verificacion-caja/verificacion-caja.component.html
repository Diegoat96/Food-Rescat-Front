<section class="rounded-2xl border border-border bg-surface p-5">
  <h3 class="text-sm font-bold uppercase tracking-wide text-text-muted">Verificar código en caja</h3>
  <p class="mt-1 text-sm text-text-muted">
    Escanea o escribe el código del cliente para completar la entrega.
  </p>

  <div class="mt-4 flex flex-col gap-3 sm:flex-row">
    <input
      type="text"
      [value]="codigo()"
      (input)="onInput($event)"
      (keydown.enter)="verificar()"
      placeholder="RC-XXXX"
      autocomplete="off"
      spellcheck="false"
      class="w-full rounded-lg border border-border px-4 py-3 font-mono text-lg uppercase tracking-widest text-text placeholder-text-muted/50 focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20"
      [class.border-error]="error()"
    />
    <button
      type="button"
      (click)="verificar()"
      [disabled]="verificando() || codigo().trim() === ''"
      class="shrink-0 rounded-lg bg-primary-600 px-6 py-3 text-sm font-bold text-white transition-colors hover:bg-primary-700 disabled:cursor-not-allowed disabled:opacity-60"
    >
      @if (verificando()) {
        <span class="inline-flex items-center gap-2">
          <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            />
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
            />
          </svg>
          Verificando…
        </span>
      } @else {
        Verificar
      }
    </button>
  </div>

  @if (exito()) {
    <p class="mt-3 rounded-lg bg-green-50 px-3 py-2 text-sm font-semibold text-green-700">
      {{ exito() }}
    </p>
  }
  @if (error()) {
    <p class="mt-3 rounded-lg bg-error-light px-3 py-2 text-sm font-semibold text-error">
      {{ error() }}
    </p>
  }
</section>
