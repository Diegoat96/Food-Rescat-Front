<div class="px-4">
  <div class="rounded-xl border border-border bg-surface-alt p-3">
    <p class="text-[10px] font-semibold uppercase tracking-wide text-text-muted">Hoy</p>

    @if (cargando() && !datos()) {
      <app-loading-spinner texto="Cargando…" [compacto]="true" />
    } @else {
      <div class="mt-2 space-y-1.5">
        <div class="flex items-center justify-between">
          <span class="flex items-center gap-1.5 text-xs text-text-muted">
            <lucide-icon name="leaf" size="14" /> Kg rescatados
          </span>
          <span class="text-xs font-bold text-text">{{ kgFormateado() }}</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="flex items-center gap-1.5 text-xs text-text-muted">
            <lucide-icon name="check-circle" size="14" /> Pedidos completados
          </span>
          <span class="text-xs font-bold text-text">{{ datos()?.ordersCompletedToday ?? 0 }}</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="flex items-center gap-1.5 text-xs text-text-muted">
            <lucide-icon name="wallet" size="14" /> Ingresos
          </span>
          <span class="text-xs font-bold text-text">{{ ingresosFormateado() }}</span>
        </div>
      </div>
    }
  </div>
</div>
