<div class="space-y-6">
  <div class="flex items-start justify-between">
    <div>
      <h2 class="text-2xl font-bold text-text">Inicio</h2>
      <p class="mt-1 text-sm text-text-muted">Resumen de tu actividad de hoy.</p>
    </div>
    <a
      routerLink="/comercio/publicar"
      class="rounded-lg bg-primary-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-primary-700"
    >
      + Publicar
    </a>
  </div>

  <!-- Formulario compacto (reuso de la variante 'compacta' en el dashboard) -->
  <section class="rounded-2xl border border-border bg-surface p-5">
    <app-publicar-paquete-form variante="compacta" />
  </section>

  <!-- Bloque "Hoy" (datos mock hasta Sprint 4) -->
  <section class="rounded-2xl border border-border bg-surface p-5">
    <h3 class="mb-4 text-sm font-bold uppercase tracking-wide text-text-muted">Hoy</h3>
    <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
      @for (m of metricas; track m.label) {
        <div class="rounded-xl bg-surface-alt p-4">
          <div class="text-2xl">{{ m.icon }}</div>
          <p class="mt-2 text-2xl font-extrabold text-text">{{ m.valor }}</p>
          <p class="text-sm text-text-muted">{{ m.label }}</p>
        </div>
      }
    </div>
  </section>

  <!-- Últimas publicaciones (mock) -->
  <section class="rounded-2xl border border-border bg-surface p-5">
    <h3 class="mb-4 text-sm font-bold uppercase tracking-wide text-text-muted">
      Últimas publicaciones
    </h3>
    <div class="divide-y divide-border">
      @for (u of ultimas; track u.titulo) {
        <div class="flex items-center justify-between py-3">
          <div>
            <p class="font-semibold text-text">{{ u.titulo }}</p>
            <p class="text-sm text-text-muted">{{ u.categoria }} · {{ u.hora }}</p>
          </div>
          <span
            class="rounded-full px-2.5 py-1 text-xs font-medium"
            [class.bg-primary-100]="u.estado === 'Activo'"
            [class.text-primary-700]="u.estado === 'Activo'"
            [class.bg-secondary-100]="u.estado === 'Pendiente'"
            [class.text-secondary-700]="u.estado === 'Pendiente'"
          >
            {{ u.estado }}
          </span>
        </div>
      }
    </div>
  </section>
</div>
