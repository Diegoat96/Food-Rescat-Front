<div
  class="pointer-events-none fixed right-4 top-4 z-50 flex w-80 max-w-[calc(100vw-2rem)] flex-col gap-2"
>
  @for (t of toasts(); track t.id) {
    <div
      class="pointer-events-auto flex items-start justify-between gap-3 rounded-xl border px-4 py-3 text-sm font-semibold shadow-lg"
      [class]="clases[t.tipo]"
    >
      <span>{{ t.mensaje }}</span>
      <button
        type="button"
        (click)="quitar(t.id)"
        class="text-lg leading-none opacity-60 transition-opacity hover:opacity-100"
        aria-label="Cerrar"
      >
        ×
      </button>
    </div>
  }
</div>
