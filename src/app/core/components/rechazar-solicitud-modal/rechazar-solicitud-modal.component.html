@if (visible) {
  <div
    role="dialog"
    aria-modal="true"
    aria-label="Rechazar solicitud"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
    (mousedown)="onBackdrop($event)"
  >
    <div class="w-full max-w-md rounded-2xl bg-surface p-6 shadow-2xl">
      <div class="flex items-start gap-4">
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-error-light text-error">
          <lucide-icon name="octagon-alert" size="22" />
        </span>

        <div class="min-w-0 flex-1">
          <div class="flex items-start justify-between gap-3">
            <h2 class="text-xl font-extrabold text-text">Rechazar solicitud</h2>
            <button
              type="button"
              (click)="cancelar()"
              class="flex h-8 w-8 items-center justify-center rounded-full text-text-muted transition-colors hover:bg-surface-alt hover:text-text"
              aria-label="Cerrar"
            >
              ✕
            </button>
          </div>
          <p class="mt-1 text-sm text-text-muted">
            Se notificará al solicitante de
            <span class="font-semibold text-text">{{ nombreNegocio }}</span> con el motivo del rechazo.
          </p>
        </div>
      </div>

      <div class="mt-5">
        <label for="motivoRechazo" class="mb-1 block text-sm font-medium text-text">
          Justificación
        </label>
        <textarea
          id="motivoRechazo"
          rows="4"
          [value]="motivo()"
          (input)="onInput($any($event.target).value)"
          placeholder="Ej: La documentación presentada no cumple con los requisitos legales."
          class="w-full resize-none rounded-lg border border-border px-4 py-3 text-text placeholder-text-muted/50 transition-colors focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20"
          [class.border-error]="mostrarError()"
        ></textarea>
        @if (mostrarError()) {
          <p class="mt-1 text-sm text-error">Escribe un motivo para poder rechazar la solicitud.</p>
        }
        <p class="mt-1 text-right text-xs text-text-muted">{{ motivo().length }} caracteres</p>
      </div>

      <div class="mt-6 flex gap-3">
        <button
          type="button"
          (click)="cancelar()"
          class="flex-1 rounded-lg bg-surface-alt px-4 py-3 text-sm font-bold text-text transition-colors hover:bg-border"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="confirmar()"
          [disabled]="motivoInvalido()"
          class="flex-1 rounded-lg bg-error px-4 py-3 text-sm font-bold text-white transition-colors hover:bg-error/90 disabled:cursor-not-allowed disabled:opacity-50"
        >
          Rechazar solicitud
        </button>
      </div>
    </div>
  </div>
}
