<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
  (click)="cerrar.emit()"
>
  <div
    class="flex max-h-[90vh] w-full max-w-2xl flex-col overflow-hidden rounded-2xl bg-surface shadow-xl"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between border-b border-border px-5 py-4">
      <h3 class="text-sm font-bold text-text">{{ titulo }}</h3>
      <button
        type="button"
        (click)="cerrar.emit()"
        aria-label="Cerrar documento"
        class="flex h-8 w-8 items-center justify-center rounded-full text-text-muted transition-colors hover:bg-surface-alt hover:text-text"
      >
        <lucide-icon name="x" size="18" />
      </button>
    </div>

    <div class="flex min-h-0 flex-1 items-center justify-center overflow-auto bg-surface-alt p-4">
      @if (esPdf()) {
        <iframe [src]="urlSegura()" class="h-[70vh] w-full rounded-lg border border-border bg-white"></iframe>
      } @else {
        <img [src]="url" [alt]="titulo" class="max-h-[70vh] rounded-lg object-contain" />
      }
    </div>
  </div>
</div>
